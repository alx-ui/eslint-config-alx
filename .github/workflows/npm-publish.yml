name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run npm publish with --dry-run (no upload)
        required: false
        type: boolean
        default: false
  workflow_run:
    workflows:
      - Semantic Release
    types:
      - completed

permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check package version on npm
        id: pkg
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${PKG_NAME}@${PKG_VERSION} is already published on npm."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "Ready to publish ${PKG_NAME}@${PKG_VERSION}."
          fi

      - name: Install dependencies
        if: steps.pkg.outputs.published == 'false' || inputs.dry_run == true
        run: npm ci

      - name: Run lint and tests
        if: steps.pkg.outputs.published == 'false' || inputs.dry_run == true
        run: npm run check

      - name: Publish to npm (OIDC Trusted Publishing)
        id: publish
        if: steps.pkg.outputs.published == 'false' || inputs.dry_run == true
        env:
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          echo "Using Node $(node -v) and npm $(npm -v)"
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --dry-run --access public
          else
            npm publish --provenance --access public
          fi

      - name: Write job summary
        if: always()
        env:
          PKG_NAME: ${{ steps.pkg.outputs.name }}
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
          ALREADY_PUBLISHED: ${{ steps.pkg.outputs.published }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          {
            echo "## npm Publish Summary"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Package | \`${PKG_NAME}\` |"
            echo "| Version | \`${PKG_VERSION}\` |"
            if [ "$DRY_RUN" = "true" ] && [ "$PUBLISH_OUTCOME" = "success" ]; then
              echo "| Status | Dry run completed |"
            elif [ "$ALREADY_PUBLISHED" = "true" ] && [ "$DRY_RUN" != "true" ]; then
              echo "| Status | Skipped (already published) |"
            elif [ "$PUBLISH_OUTCOME" = "success" ]; then
              echo "| Status | Published with OIDC provenance |"
              echo "| Registry | https://www.npmjs.com/package/${PKG_NAME}/v/${PKG_VERSION} |"
            else
              echo "| Status | Failed |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
